name: Technical PDF review
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check technical_review tests scripts
      - run: uv run --no-sync ruff format --check technical_review tests scripts
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          uv venv "$smoke_dir/env"
          uv pip install --python "$smoke_dir/env/bin/python" dist/*.whl
          cd "$smoke_dir"
          env/bin/python -I -c "import technical_review.cli, technical_review.build, technical_review.extract"
          env/bin/technical-review --help
      - name: Run tests from the source distribution
        shell: bash
        run: |
          source_dir=$(mktemp -d)
          tar -xf dist/*.tar.gz -C "$source_dir"
          cd "$source_dir"/technical_document_review-*
          uv sync --locked --extra dev
          uv run --no-sync pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technical-review-${{ matrix.python }}
          path: dist/
